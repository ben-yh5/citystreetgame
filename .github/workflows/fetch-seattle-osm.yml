name: Refresh Seattle OSM Cache

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of each month, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fetch latest Seattle OSM data
        run: node scripts/fetch-seattle-osm.mjs

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/osm/seattle-ways.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh Seattle OSM cache"
          git push
